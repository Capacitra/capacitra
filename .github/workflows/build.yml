name: Build Capacitra.exe

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch: {}

# Least privilege: the build job can only read the repo.
# Only the release job below gets write access.
permissions:
  contents: read

jobs:
  build:
    name: Build (Python 3.11)
    runs-on: windows-latest
    outputs:
      sha256: ${{ steps.sha.outputs.sha256 }}
    env:
      # secrets cannot be read in `if:`, so expose only a yes/no flag
      HAS_CERT: ${{ secrets.CERT_PFX_BASE64 != '' }}

    steps:
      # Third-party actions are pinned to full commit SHAs so a moved tag
      # cannot inject code into the release build.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile check
        run: python -m py_compile Capacitra.pyw

      - name: Generate icon
        run: python make_icon.py

      - name: Build executable
        run: pyinstaller --clean Capacitra.spec

      - name: Sign executable (release only)
        # Runs only when a certificate secret exists. If signing is
        # configured and fails, the release fails instead of silently
        # shipping an unsigned binary.
        if: github.event_name == 'release' && env.HAS_CERT == 'true'
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ secrets.CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          $pfx = "$env:RUNNER_TEMP\cert.pfx"
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_BASE64))
            & signtool sign /f $pfx /p $env:CERT_PASSWORD `
              /fd sha256 /tr http://timestamp.digicert.com /td sha256 `
              dist\Capacitra.exe
            if ($LASTEXITCODE -ne 0) { throw "signtool failed ($LASTEXITCODE)" }
          } finally {
            Remove-Item $pfx -ErrorAction SilentlyContinue
          }

      - name: Compute SHA-256
        id: sha
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path dist\Capacitra.exe -Algorithm SHA256).Hash.ToLower()
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "$hash  Capacitra.exe" | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Write-Host "Capacitra.exe SHA-256: $hash"

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Capacitra-${{ github.sha }}
          path: |
            dist/Capacitra.exe
            dist/SHA256SUMS.txt
          retention-days: 30

  release:
    name: Attach to GitHub Release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Capacitra-${{ github.sha }}
          path: dist

      - name: Attach files
        # No body_path: the release notes you write in the GitHub UI stay
        # untouched. Only the binary and its checksum are added.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/Capacitra.exe
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
